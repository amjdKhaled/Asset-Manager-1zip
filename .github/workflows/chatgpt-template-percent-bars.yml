name: Apply template percentage bars

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/chatgpt-template-percent-bars.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update template percentage bars
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/LFPortal.Web/Views/Dashboard/Index.cshtml')
          s = path.read_text(encoding='utf-8')

          old_css = '''.template-percent { display:flex; align-items:center; gap:10px; width:100%; }
          .template-percent-text { min-width:45px; flex-shrink:0; font-size:11px; color:#64748B; font-variant-numeric:tabular-nums; text-align:end; }
          .template-progress-track { position:relative; width:min(320px,100%); min-width:140px; height:8px; background:#EEF2F2; border-radius:999px; overflow:hidden; }
          .template-progress-fill { position:absolute; inset-block:0; inset-inline-start:0; background:#0B66D4; border-radius:999px; min-width:2px; }'''
          new_css = '''.template-percent-cell { width:40%; min-width:320px; }
          .template-percent-chart { display:flex; align-items:center; gap:12px; width:100%; }
          .template-percent-canvas { position:relative; flex:1 1 auto; min-width:0; height:28px; }
          .template-percent-canvas canvas { width:100% !important; height:28px !important; }
          .totalPercentText { min-width:48px; flex-shrink:0; font-size:11px; color:#64748B; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:end; }
          @@media(max-width:700px){.template-percent-cell{min-width:220px}.totalPercentText{min-width:42px}.template-percent-chart{gap:8px}}'''
          if old_css not in s:
              raise SystemExit('Expected template percentage CSS block not found')
          s = s.replace(old_css, new_css, 1)

          s = re.sub(
              r'\n\s*var percent = s\.TotalDocuments > 0 \? \(double\)t\.Count / s\.TotalDocuments \* 100 : 0;\n\s*var percentWidth = percent\.ToString\("0\.0", System\.Globalization\.CultureInfo\.InvariantCulture\);',
              '', s, count=1)

          cell_pattern = re.compile(
              r'<td style="color:var\(--d-muted\)">\s*'
              r'<div class="template-percent">.*?'
              r'</div>\s*'
              r'</td>',
              re.S
          )
          cell_replacement = '''<td class="template-percent-cell" style="color:var(--d-muted)">
                            <div class="template-percent-chart">
                                <div class="template-percent-canvas">
                                    <canvas class="totalPercent" data-index="@i"></canvas>
                                </div>
                                <span class="totalPercentText"></span>
                            </div>
                        </td>'''
          s, n = cell_pattern.subn(cell_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected template percentage table cell not found (matches={n})')

          js_pattern = re.compile(
              r'document\.querySelectorAll\("\.totalPercent"\)\.forEach\(\(canvas, index\) => \{.*?\n\}\);\n\nconst tmplEl',
              re.S
          )
          js_replacement = '''const isRtlPercent = document.documentElement.dir === "rtl";

          document.querySelectorAll(".totalPercent").forEach((canvas, index) => {
              const count = Number(templateData[index] ?? 0);
              const percent = totalDocuments > 0 ? (count / totalDocuments) * 100 : 0;
              const textElement = canvas.closest("td")?.querySelector(".totalPercentText");
              if (textElement) textElement.textContent = `${percent.toFixed(1)}%`;

              new Chart(canvas, {
                  type:"bar",
                  data:{
                      labels:[""],
                      datasets:[
                          {
                              label:"100%",
                              data:[100],
                              backgroundColor:"#EEF2F2",
                              borderWidth:0,
                              borderRadius:999,
                              borderSkipped:false,
                              grouped:false,
                              barThickness:8,
                              order:2
                          },
                          {
                              label:templateLabels[index],
                              data:[percent],
                              backgroundColor:"#0B66D4",
                              borderWidth:0,
                              borderRadius:999,
                              borderSkipped:false,
                              grouped:false,
                              barThickness:8,
                              order:1
                          }
                      ]
                  },
                  options:{
                      responsive:true,
                      maintainAspectRatio:false,
                      indexAxis:"y",
                      animation:{duration:400},
                      plugins:{
                          legend:{display:false},
                          tooltip:{
                              ...TOOLTIP,
                              filter:item=>item.datasetIndex===1,
                              callbacks:{label:()=>`${percent.toFixed(1)}%`}
                          }
                      },
                      scales:{
                          x:{min:0,max:100,reverse:isRtlPercent,display:false,grid:{display:false},border:{display:false}},
                          y:{display:false,grid:{display:false},border:{display:false}}
                      }
                  }
              });
          });

          const tmplEl'''
          s, n = js_pattern.subn(js_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected totalPercent Chart.js block not found (matches={n})')

          path.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LFPortal.Web/Views/Dashboard/Index.cshtml
          git diff --cached --check
          git commit -m "Use full-width Chart.js template percentage bars"
          git push origin main
