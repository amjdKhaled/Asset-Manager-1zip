name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build/**"
      - "config/**"
      - "installer/**"
      - "src/**"
      - "Directory.Build.props"
      - "LFPortal.sln"
      - ".config/dotnet-tools.json"
      - ".github/workflows/windows-installer.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "Release/**"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.wixproj
            .config/dotnet-tools.json

      - name: Build and validate installer
        shell: powershell
        run: .\build\publish.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Laserfiche-Dashboard-Windows-${{ github.sha }}
          path: |
            Release/LFDashboard-Setup.exe
            Release/README.txt
            Release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish installer to Release folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Release/LFDashboard-Setup.exe Release/README.txt Release/SHA256SUMS.txt
          $releaseChanges = git status --porcelain -- Release/
          if ($releaseChanges) {
            git commit -m "chore(release): publish Windows installer [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "Release files are already current."
          }
