name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build/**"
      - "config/**"
      - "installer/**"
      - "src/**"
      - "Directory.Build.props"
      - "LFPortal.sln"
      - ".config/dotnet-tools.json"
      - ".github/workflows/windows-installer.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "Release/**"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.wixproj
            .config/dotnet-tools.json

      - name: Run application regression tests
        shell: powershell
        run: |
          dotnet test LFPortal.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test deployment IIS isolation and inherited settings
        shell: powershell
        run: .\build\Test-DeployIisIsolation.ps1

      - name: Run installer isolation regression tests
        shell: powershell
        run: |
          dotnet run --project installer/Dashboard.InstallerSafety.Tests --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and validate installer
        shell: powershell
        run: .\build\publish.ps1

      - name: Verify bundled converter and offline standalone startup
        shell: powershell
        run: .\build\Test-OfflinePreview.ps1

      - name: Exercise Web Client install and rollback in isolated fixtures
        shell: powershell
        run: .\installer\Test-WebClientSafety.ps1

      - name: Test MSI lifecycle isolation on disposable Windows runner
        shell: powershell
        run: .\installer\Test-MsiIsolation.ps1 -DisposableRunner

      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Installer-isolation-logs-${{ github.sha }}
          path: artifacts/msi-*.log
          if-no-files-found: ignore

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Laserfiche-Dashboard-Windows-${{ github.sha }}
          path: |
            Release/LFDashboard-Setup.exe
            Release/LFDashboard-Standalone-win-x64.zip
            Release/README.txt
            Release/SHA256SUMS.txt
            Release/build-info.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish downloadable Windows packages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dashboard-1.0.5-${{ github.run_number }}"
          gh release create $tag Release/LFDashboard-Setup.exe Release/LFDashboard-Standalone-win-x64.zip Release/README.txt Release/SHA256SUMS.txt Release/build-info.json --target ${{ github.sha }} --title "Dashboard 1.0.5 offline Windows packages" --notes "Includes local Office-to-PDF conversion, TIFF previews and offline browser assets. Standalone ZIP requires no SDK or IIS. See README.txt."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Downloadable preview requested for this implementation branch. It is
      # published only after all conversion, offline and installer checks pass.
      - name: Publish offline preview packages
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/offline-document-preview' && github.event.pull_request.head.repo.full_name == github.repository
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dashboard-1.0.5-preview-${{ github.run_number }}"
          gh release create $tag Release/LFDashboard-Setup.exe Release/LFDashboard-Standalone-win-x64.zip Release/README.txt Release/SHA256SUMS.txt Release/build-info.json --target ${{ github.event.pull_request.head.sha }} --prerelease --title "Dashboard 1.0.5 offline preview" --notes "Preview packages for PR #${{ github.event.pull_request.number }}. Built and checked from the linked source commit. Includes installed and standalone Windows packages with local Office conversion. Verify against your live Laserfiche repository before production deployment."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
